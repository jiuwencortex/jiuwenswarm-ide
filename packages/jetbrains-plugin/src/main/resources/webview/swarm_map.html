<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"/>
<style>
/* ── Theme tokens ──
   Dark by default; light theme via :root[data-theme="light"].
   In VS Code the data-theme attribute is driven by the .vscode-dark/.vscode-light
   body classes; in JetBrains JCEF it falls back to prefers-color-scheme — the
   same behaviour as the chat webview. */
:root {
  --swarm-bg: #1e1e1e;
  --swarm-fg: #ccc;
  --swarm-muted: #888;
  --swarm-dim: #666;
  --swarm-border: #333;
  --swarm-header-fg: #aaa;
  --swarm-focus: #007acc;
  --swarm-pill-in-progress-bg: #1e3a1e;
  --swarm-pill-in-progress-border: #3a7a3a;
  --swarm-pill-in-progress-fg: #7ec87e;
  --swarm-pill-pending-bg: #2a2a1e;
  --swarm-pill-pending-border: #6a6a3a;
  --swarm-pill-pending-fg: #c8c87e;
  --swarm-pill-done-bg: #1a1a1a;
  --swarm-pill-done-border: #444;
  --swarm-pill-done-fg: #666;
  --swarm-busy-edge: #3a7a3a;
  --swarm-paused-edge: #7a7a3a;
  --swarm-ready-edge: #444;
  --swarm-role-bg: #333;
  --swarm-role-fg: #aaa;
  --swarm-role-leader-bg: #2a2045;
  --swarm-role-leader-fg: #a07ae8;
  --swarm-summary-bg: #1a1a1a;
  --swarm-msg-sep: #2a2a2a;
  --swarm-arrow: #555;
  --swarm-idle-warn: #c9c94e;
  --swarm-debug-text: #4ec9b0;
}

:root[data-theme="light"] {
  --swarm-bg: #f6f6f6;
  --swarm-fg: #242424;
  --swarm-muted: #5f6b7a;
  --swarm-dim: #9e9e9e;
  --swarm-border: #d4d4d4;
  --swarm-header-fg: #6e6e6e;
  --swarm-focus: #0078d4;
  --swarm-pill-in-progress-bg: #e8f5e9;
  --swarm-pill-in-progress-border: #4caf50;
  --swarm-pill-in-progress-fg: #1b5e20;
  --swarm-pill-pending-bg: #fff8e1;
  --swarm-pill-pending-border: #fbc02d;
  --swarm-pill-pending-fg: #6d5b00;
  --swarm-pill-done-bg: #f0f0f0;
  --swarm-pill-done-border: #d4d4d4;
  --swarm-pill-done-fg: #8a8a8a;
  --swarm-busy-edge: #2e7d32;
  --swarm-paused-edge: #a18c0a;
  --swarm-ready-edge: #d4d4d4;
  --swarm-role-bg: #e0e0e0;
  --swarm-role-fg: #444;
  --swarm-role-leader-bg: #e8e0f7;
  --swarm-role-leader-fg: #5e35b1;
  --swarm-summary-bg: #f0f0f0;
  --swarm-msg-sep: #e0e0e0;
  --swarm-arrow: #8a8a8a;
  --swarm-idle-warn: #b8860b;
  --swarm-debug-text: #007a6e;
}

/* ── Reset ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--vscode-font-family, system-ui, sans-serif);
  font-size: 12px;
  background: var(--swarm-bg);
  color: var(--swarm-fg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
#header {
  padding: 6px 10px;
  border-bottom: 1px solid var(--swarm-border);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--swarm-header-fg);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#progress-chip {
  font-size: 10px;
  font-weight: normal;
  letter-spacing: 0;
  text-transform: none;
  color: var(--swarm-muted);
  white-space: nowrap;
}

/* ── Task board ── */
#task-board {
  padding: 6px 10px;
  border-bottom: 1px solid var(--swarm-border);
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  flex-shrink: 0;
  min-height: 30px;
}
.task-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 11px;
  max-width: 220px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.task-pill.in_progress { background: var(--swarm-pill-in-progress-bg); border: 1px solid var(--swarm-pill-in-progress-border); color: var(--swarm-pill-in-progress-fg); }
.task-pill.pending     { background: var(--swarm-pill-pending-bg); border: 1px solid var(--swarm-pill-pending-border); color: var(--swarm-pill-pending-fg); }
.task-pill.completed   { background: var(--swarm-pill-done-bg); border: 1px solid var(--swarm-pill-done-border); color: var(--swarm-pill-done-fg); }
.task-pill.cancelled   { background: var(--swarm-pill-done-bg); border: 1px solid var(--swarm-pill-done-border); color: var(--swarm-pill-done-fg); text-decoration: line-through; }
.task-assignee { font-size: 10px; opacity: .7; }

/* ── Lane list ── */
#lanes {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* ── Lane card ── */
.lane-card {
  border: 1px solid var(--swarm-border);
  border-radius: 5px;
  padding: 8px 10px;
  cursor: pointer;
  transition: border-color .15s;
  position: relative;
}
.lane-card:hover { border-color: var(--swarm-focus); }
.lane-card.status-SHUTDOWN { opacity: .45; }
.lane-card.status-BUSY    { border-left: 3px solid var(--swarm-busy-edge); }
.lane-card.status-RUNNING { border-left: 3px solid var(--swarm-busy-edge); }
.lane-card.status-PAUSED  { border-left: 3px solid var(--swarm-paused-edge); }
.lane-card.status-READY   { border-left: 3px solid var(--swarm-ready-edge); }

/* Jump-to-file hint on cards that have a live path */
.lane-card.has-path:hover::after {
  content: '↗ open file';
  position: absolute;
  top: 8px; right: 8px;
  font-size: 10px;
  color: var(--swarm-focus);
  opacity: .85;
}

.lane-name {
  font-weight: 600;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.lane-role-badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 8px;
  text-transform: uppercase;
  letter-spacing: .04em;
  background: var(--swarm-role-bg);
  color: var(--swarm-role-fg);
}
.lane-role-badge.LEADER { background: var(--swarm-role-leader-bg); color: var(--swarm-role-leader-fg); }

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.status-dot.BUSY     { background: #4ec94e; animation: pulse 1.4s ease-in-out infinite; }
.status-dot.RUNNING  { background: #4ec94e; animation: pulse 1.4s ease-in-out infinite; }
.status-dot.PAUSED   { background: #c9c94e; }
.status-dot.READY    { background: #8a8a8a; }
.status-dot.SHUTDOWN { background: #4a4a4a; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .35; }
}

.lane-activity {
  margin-top: 4px;
  font-size: 11px;
  color: var(--swarm-muted);
  font-family: var(--vscode-editor-font-family, monospace);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lane-task {
  margin-top: 2px;
  font-size: 11px;
  color: var(--swarm-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lane-idle-warning {
  position: absolute;
  top: 8px; right: 8px;
  font-size: 10px;
  color: var(--swarm-idle-warn);
}

/* ── Summary card (shown when all lanes SHUTDOWN) ── */
#summary-card {
  display: none;
  margin: 6px;
  border: 1px solid var(--swarm-border);
  border-radius: 5px;
  padding: 12px 14px;
  background: var(--swarm-summary-bg);
}
#summary-card h3 {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--swarm-fg);
}
.summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--swarm-muted);
  margin-bottom: 3px;
}
.summary-row .summary-val {
  color: var(--swarm-fg);
  font-weight: 600;
}

/* ── Timeline bar ── */
#timeline {
  height: 28px;
  flex-shrink: 0;
  padding: 4px 10px;
  border-top: 1px solid var(--swarm-border);
  position: relative;
  overflow: hidden;
}
.timeline-track {
  position: absolute;
  top: 8px; height: 4px;
  border-radius: 2px;
  opacity: .75;
}

/* ── Message log ── */
#msg-section {
  flex-shrink: 0;
  border-top: 1px solid var(--swarm-border);
  display: none;
}
#msg-toggle {
  padding: 4px 10px;
  font-size: 10px;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--swarm-muted);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 5px;
}
#msg-toggle:hover { color: var(--swarm-fg); }
#msg-list {
  max-height: 120px;
  overflow-y: auto;
  padding: 0 10px 6px;
  display: none;
}
.msg-row {
  display: flex;
  gap: 6px;
  padding: 2px 0;
  border-bottom: 1px solid var(--swarm-msg-sep);
  font-size: 11px;
  line-height: 1.4;
}
.msg-from {
  flex-shrink: 0;
  font-weight: 600;
  min-width: 70px;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.msg-arrow { color: var(--swarm-arrow); flex-shrink: 0; }
.msg-to {
  flex-shrink: 0;
  min-width: 50px;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--swarm-muted);
}
.msg-content {
  flex: 1;
  color: var(--swarm-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Empty state ── */
#empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--swarm-dim);
  font-size: 12px;
  text-align: center;
  padding: 20px;
}

/* ── Header menu (dropdown) ── */
#header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-btn {
  background: none;
  border: none;
  color: var(--swarm-muted);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 5px;
  border-radius: 3px;
}
.header-btn:hover { color: var(--swarm-fg); background: var(--swarm-border); }
.header-dropdown { position: relative; }
.dropdown-menu {
  display: none;
  position: absolute;
  right: 0;
  top: 100%;
  margin-top: 2px;
  min-width: 150px;
  background: var(--swarm-bg);
  border: 1px solid var(--swarm-border);
  border-radius: 5px;
  z-index: 100;
  padding: 4px 0;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
}
.dropdown-menu.visible { display: block; }
.dropdown-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  font-size: 11px;
  color: var(--swarm-fg);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.dropdown-item:hover { background: var(--swarm-border); }

/* ── Debug console (closed by default; toggled from the menu) ── */
#debug-panel {
  display: none;
  height: 140px;
  border-top: 1px solid var(--swarm-border);
  background: var(--swarm-bg);
  flex-shrink: 0;
  flex-direction: column;
}
#debug-panel.visible { display: flex; }
#debug-panel-header {
  display: flex;
  align-items: center;
  padding: 2px 8px;
  background: var(--swarm-border);
  border-bottom: 1px solid var(--swarm-border);
  flex-shrink: 0;
  gap: 6px;
}
#debug-panel-header span:first-child {
  font-size: 10px;
  color: var(--swarm-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  flex: 1;
}
#debug-clear-btn, #debug-copy-btn {
  background: none;
  border: none;
  color: var(--swarm-dim);
  cursor: pointer;
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 3px;
}
#debug-clear-btn:hover, #debug-copy-btn:hover { color: var(--swarm-fg); background: var(--swarm-bg); }
#debug-log {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
  font-family: var(--vscode-editor-font-family, monospace);
  font-size: 10px;
  line-height: 1.5;
}
#debug-log::-webkit-scrollbar { width: 4px; }
#debug-log::-webkit-scrollbar-thumb { background: var(--swarm-border); border-radius: 2px; }
.debug-line { color: var(--swarm-debug-text); white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>

<div id="header">
  <span>JiuwenSwarm · Swarm Map</span>
  <div id="header-right">
    <span id="progress-chip"></span>
    <div class="header-dropdown">
      <button class="header-btn" onclick="toggleMenu()" title="Menu">☰</button>
      <div id="swarm-menu" class="dropdown-menu">
        <div class="dropdown-item" onclick="toggleDebugFromMenu()">
          <span id="debug-check">☐</span> Debug log
        </div>
      </div>
    </div>
  </div>
</div>

<div id="task-board"></div>

<div id="lanes">
  <div id="empty">No active team session.<br>Start a conversation in <code>code.team</code> mode.</div>
  <div id="summary-card"></div>
</div>

<div id="timeline"></div>

<div id="msg-section">
  <div id="msg-toggle" onclick="toggleMsgLog()">
    <span id="msg-chevron">▶</span>
    <span id="msg-label">Messages</span>
  </div>
  <div id="msg-list"></div>
</div>

<!-- Debug console — closed by default, toggled from the ☰ menu -->
<div id="debug-panel">
  <div id="debug-panel-header">
    <span>Debug Log</span>
    <button id="debug-clear-btn" onclick="clearDebugLog()" title="Clear">Clear</button>
    <button id="debug-copy-btn" onclick="copyDebugLog()" title="Copy log to clipboard">Copy</button>
  </div>
  <div id="debug-log"></div>
</div>

<script>
// ── Constants ──────────────────────────────────────────
var IDLE_WARN_MS       = 30000;   // show amber warning after 30s of BUSY with no activity
var TIMELINE_WINDOW_MS = 90000;   // last 90 seconds shown in timeline bar

// Colour per member (assigned round-robin from this palette)
var LANE_COLOURS = ['#4ec94e','#4ea8e8','#e8a84e','#c94ee8','#e84e4e','#4ee8c9'];
var _laneColourMap = {};  // memberName → colour

// ── State ──────────────────────────────────────────────
var _state = null;        // SwarmSnapshot | null
var _msgOpen = false;     // message log expanded?
var _debugOpen = false;   // debug console expanded?

// ── Theme ──────────────────────────────────────────────
// Match the host theme: VS Code webviews set .vscode-dark/.vscode-light on <body>;
// JetBrains JCEF has no such classes, so fall back to the OS colour scheme —
// the same behaviour as the chat webview.
function applySwarmTheme() {
  var isDark;
  var isVsCodeDark  = document.body.classList.contains('vscode-dark') || document.body.classList.contains('vscode-high-contrast');
  var isVsCodeLight = document.body.classList.contains('vscode-light') || document.body.classList.contains('vscode-high-contrast-light');
  if (isVsCodeDark || isVsCodeLight) {
    isDark = isVsCodeDark;
  } else {
    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
}
applySwarmTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySwarmTheme);

// ── Entry point ────────────────────────────────────────
// Called by JetBrains (via executeJavaScript) or VS Code (via window.addEventListener)
window.__swarmReceive = function(snapshot) {
  _state = snapshot;
  render();
};

// Called by JetBrains for debug-log lines (host → webview)
window.__swarmDebug = function(line) {
  appendDebugLog(line);
};

// VS Code host → webview message bridge
window.addEventListener('message', function(e) {
  var msg = e.data;
  if (!msg) return;
  if (msg.type === 'swarm_snapshot') {
    window.__swarmReceive(msg.snapshot);
  } else if (msg.type === 'swarm_debug') {
    window.__swarmDebug(msg.line);
  }
});

// Signal ready to VS Code host (no-op in JetBrains where acquireVsCodeApi is undefined)
var _vscode;
if (typeof acquireVsCodeApi !== 'undefined') {
  _vscode = acquireVsCodeApi();
  _vscode.postMessage({ type: 'swarm_ready' });
}

// ── Rendering ──────────────────────────────────────────
function render() {
  if (!_state || _state.lanes.length === 0) {
    showEmpty(true);
    renderProgress(null);
    hideTimeline();
    hideMsgSection();
    return;
  }
  showEmpty(false);
  renderProgress(_state);
  renderTaskBoard(_state.tasks);
  var allShutdown = _state.lanes.every(function(l) { return l.status === 'SHUTDOWN'; });
  if (allShutdown) {
    renderSummaryCard(_state);
    hideLanes();
    hideTimeline();
  } else {
    hideSummaryCard();
    renderLanes(_state.lanes);
    renderTimeline(_state.lanes);
  }
  renderMessages(_state.messages || []);
}

function showEmpty(visible) {
  document.getElementById('empty').style.display = visible ? 'flex' : 'none';
}

function hideLanes() {
  // Hide all lane cards, leave summary card visible
  document.querySelectorAll('.lane-card').forEach(function(el) {
    el.style.display = 'none';
  });
}

function hideSummaryCard() {
  document.getElementById('summary-card').style.display = 'none';
  // Restore any hidden lane cards
  document.querySelectorAll('.lane-card').forEach(function(el) {
    el.style.display = '';
  });
}

// ── Progress chip ──────────────────────────────────────
function renderProgress(state) {
  var chip = document.getElementById('progress-chip');
  if (!state || state.lanes.length === 0) {
    chip.textContent = '';
    return;
  }
  var tasks = state.tasks || [];
  var done  = tasks.filter(function(t) { return t.status === 'completed'; }).length;
  var total = tasks.length;
  var active = state.lanes.filter(function(l) {
    return l.status === 'BUSY' || l.status === 'RUNNING' || l.status === 'READY';
  }).length;

  var parts = [];
  if (total > 0) parts.push(done + '/' + total + ' tasks');
  if (active > 0) parts.push(active + ' agent' + (active !== 1 ? 's' : ''));
  chip.textContent = parts.join(' · ');
}

// ── Task board ─────────────────────────────────────────
function renderTaskBoard(tasks) {
  var board = document.getElementById('task-board');
  board.innerHTML = '';
  tasks.forEach(function(task) {
    var pill = document.createElement('div');
    pill.className = 'task-pill ' + task.status;
    var icon = task.status === 'completed' ? '✓'
             : task.status === 'cancelled' ? '✗'
             : '⚙';
    var assigneePart = task.assignee
      ? ' <span class="task-assignee">\u2192 ' + esc(task.assignee) + '</span>'
      : '';
    pill.innerHTML = icon + ' ' + esc(truncate(task.title, 28)) + assigneePart;
    pill.title = task.title + (task.assignee ? ' \u2192 ' + task.assignee : '');
    board.appendChild(pill);
  });
}

// ── Lane list ──────────────────────────────────────────
function renderLanes(lanes) {
  var container = document.getElementById('lanes');

  // Build a map of existing cards by memberName for in-place update
  var existing = {};
  container.querySelectorAll('.lane-card').forEach(function(el) {
    existing[el.dataset.member] = el;
  });

  // Render in sorted order; append missing, update existing
  var rendered = {};
  lanes.forEach(function(lane, i) {
    rendered[lane.memberName] = true;
    assignColour(lane.memberName);
    var card = existing[lane.memberName] || createLaneCard(lane.memberName);
    updateLaneCard(card, lane, i);
    card.style.display = '';
    if (!existing[lane.memberName]) container.appendChild(card);
  });

  // Remove cards for members no longer in state
  Object.keys(existing).forEach(function(name) {
    if (!rendered[name]) existing[name].remove();
  });
}

function createLaneCard(memberName) {
  var card = document.createElement('div');
  card.className = 'lane-card';
  card.dataset.member = memberName;
  card.innerHTML = [
    '<div class="lane-name">',
    '  <span class="status-dot"></span>',
    '  <span class="lane-display-name"></span>',
    '  <span class="lane-role-badge"></span>',
    '</div>',
    '<div class="lane-activity"></div>',
    '<div class="lane-task"></div>',
    '<span class="lane-idle-warning"></span>',
  ].join('');
  card.addEventListener('click', function() {
    sendMessage({ type: 'open_lane', memberName: memberName });
  });
  return card;
}

function updateLaneCard(card, lane, sortIndex) {
  var hasPath = !!lane.lastActivePath;
  card.className = 'lane-card status-' + lane.status + (hasPath ? ' has-path' : '');
  card.style.order = String(sortIndex);

  var dot = card.querySelector('.status-dot');
  dot.className = 'status-dot ' + lane.status;

  card.querySelector('.lane-display-name').textContent = lane.displayName;

  var badge = card.querySelector('.lane-role-badge');
  badge.textContent = lane.role;
  badge.className   = 'lane-role-badge ' + lane.role;

  var actEl = card.querySelector('.lane-activity');
  actEl.textContent = lane.currentActivity || (lane.status === 'SHUTDOWN' ? 'Finished' : '\u2014');

  var taskEl = card.querySelector('.lane-task');
  taskEl.textContent = lane.currentTaskTitle ? 'Task: ' + lane.currentTaskTitle : '';

  // Idle warning: BUSY but no activity update for > IDLE_WARN_MS
  // (don't render if has-path hint will show on hover)
  var warnEl = card.querySelector('.lane-idle-warning');
  var idleMs = Date.now() - lane.lastActiveAt;
  if ((lane.status === 'BUSY' || lane.status === 'RUNNING') && idleMs > IDLE_WARN_MS) {
    warnEl.textContent = '\u26a0 idle ' + Math.floor(idleMs / 1000) + 's';
  } else {
    warnEl.textContent = '';
  }
}

// ── Summary card ───────────────────────────────────────
function renderSummaryCard(state) {
  var card = document.getElementById('summary-card');
  var tasks = state.tasks || [];
  var done  = tasks.filter(function(t) { return t.status === 'completed'; }).length;
  var cancelled = tasks.filter(function(t) { return t.status === 'cancelled'; }).length;
  var msgs  = (state.messages || []).length;
  var agents = state.lanes.length;
  var teamName = state.teamName || 'Team';

  card.innerHTML = [
    '<h3>✓ ' + esc(teamName) + ' · Session complete</h3>',
    row('Agents', agents),
    row('Tasks completed', done + (cancelled ? ' (' + cancelled + ' cancelled)' : '')),
    row('Messages exchanged', msgs),
  ].join('');
  card.style.display = 'block';
}

function row(label, value) {
  return '<div class="summary-row"><span>' + esc(label) + '</span><span class="summary-val">' + esc(String(value)) + '</span></div>';
}

// ── Timeline bar ───────────────────────────────────────
function hideTimeline() {
  document.getElementById('timeline').style.display = 'none';
}

function renderTimeline(lanes) {
  var bar   = document.getElementById('timeline');
  bar.style.display = 'block';
  var width = bar.clientWidth - 20;  // 10px padding each side
  var now   = Date.now();
  var start = now - TIMELINE_WINDOW_MS;

  bar.innerHTML = '';
  lanes.forEach(function(lane) {
    if (lane.status === 'SHUTDOWN' && lane.lastActiveAt < start) return;
    var colour   = _laneColourMap[lane.memberName] || '#666';
    var segStart = Math.max(lane.lastActiveAt - 5000, start);  // approximate 5s window
    var segEnd   = (lane.status === 'BUSY' || lane.status === 'RUNNING') ? now : lane.lastActiveAt;
    if (segEnd <= segStart) return;

    var left = ((segStart - start) / TIMELINE_WINDOW_MS) * width + 10;
    var segW = ((segEnd - segStart)  / TIMELINE_WINDOW_MS) * width;
    var track = document.createElement('div');
    track.className = 'timeline-track';
    track.style.cssText = 'left:' + left + 'px;width:' + segW + 'px;background:' + colour + ';';
    track.title = lane.displayName;
    bar.appendChild(track);
  });
}

// ── Message log ────────────────────────────────────────
function renderMessages(messages) {
  var section = document.getElementById('msg-section');
  if (!messages || messages.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';

  var label = document.getElementById('msg-label');
  label.textContent = 'Messages (' + messages.length + ')';

  if (!_msgOpen) return;  // list content only updated when open

  var list = document.getElementById('msg-list');
  list.innerHTML = '';
  // Show most-recent last (chronological)
  messages.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'msg-row';
    var colour = _laneColourMap[m.from] || '#888';
    div.innerHTML = [
      '<span class="msg-from" style="color:' + colour + '">' + esc(truncate(m.from, 14)) + '</span>',
      '<span class="msg-arrow">→</span>',
      '<span class="msg-to">' + esc(truncate(m.to || 'all', 12)) + '</span>',
      '<span class="msg-content">' + esc(truncate(m.content, 60)) + '</span>',
    ].join('');
    div.title = (m.to ? m.from + ' → ' + m.to + ': ' : m.from + ': ') + m.content;
    list.appendChild(div);
  });
  // Scroll to bottom
  list.scrollTop = list.scrollHeight;
}

function hideMsgSection() {
  document.getElementById('msg-section').style.display = 'none';
}

function toggleMsgLog() {
  _msgOpen = !_msgOpen;
  var list = document.getElementById('msg-list');
  var chevron = document.getElementById('msg-chevron');
  list.style.display = _msgOpen ? 'block' : 'none';
  chevron.textContent = _msgOpen ? '▼' : '▶';
  // Re-render content if opening
  if (_msgOpen && _state) renderMessages(_state.messages || []);
}

// ── Menu & debug console ───────────────────────────────
function toggleMenu() {
  var menu = document.getElementById('swarm-menu');
  menu.classList.toggle('visible');
}

function toggleDebugFromMenu() {
  _debugOpen = !_debugOpen;
  document.getElementById('debug-check').textContent = _debugOpen ? '☑' : '☐';
  document.getElementById('swarm-menu').classList.remove('visible');
  document.getElementById('debug-panel').classList.toggle('visible', _debugOpen);
}

function appendDebugLog(line) {
  var log = document.getElementById('debug-log');
  if (!log) return;
  var lineEl = document.createElement('div');
  lineEl.className = 'debug-line';
  lineEl.textContent = '[' + new Date().toLocaleTimeString() + '] ' + line;
  log.appendChild(lineEl);
  // Keep at most 500 lines to avoid memory growth
  while (log.children.length > 500) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function clearDebugLog() {
  var log = document.getElementById('debug-log');
  if (log) log.innerHTML = '';
}

function copyDebugLog() {
  var log = document.getElementById('debug-log');
  if (!log) return;
  var lines = [];
  for (var i = 0; i < log.children.length; i++) {
    lines.push(log.children[i].textContent);
  }
  var text = lines.join('\n');
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

// Click outside to close the ☰ menu
document.addEventListener('click', function(e) {
  var menu = document.getElementById('swarm-menu');
  var btn = document.querySelector('#header .header-btn');
  if (menu.classList.contains('visible') && !menu.contains(e.target) && e.target !== btn) {
    menu.classList.remove('visible');
  }
});

// ── Helpers ────────────────────────────────────────────
function assignColour(memberName) {
  if (!_laneColourMap[memberName]) {
    var idx = Object.keys(_laneColourMap).length % LANE_COLOURS.length;
    _laneColourMap[memberName] = LANE_COLOURS[idx];
  }
}

function sendMessage(obj) {
  // JetBrains bridge
  if (typeof window.__swarmSend === 'function') {
    window.__swarmSend(JSON.stringify(obj));
  }
  // VS Code bridge
  if (typeof _vscode !== 'undefined') {
    _vscode.postMessage(obj);
  }
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function truncate(s, n) {
  return s && s.length > n ? s.slice(0, n) + '\u2026' : (s || '');
}

// Refresh idle timers every 5s without a full server push
setInterval(function() { if (_state) render(); }, 5000);
</script>
